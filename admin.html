<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Staff Login — JAMA Protection Services</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-shell">

<!-- ============ LOGIN VIEW ============ -->
<div class="login-shell" id="loginView">
  <div class="login-card">
    <div class="eyebrow on-dark">Staff Only</div>
    <h1>Review Console</h1>
    <p class="lede">Sign in with your admin account to moderate client reviews.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="lEmail">Email</label>
        <input type="email" id="lEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label for="lPass">Password</label>
        <input type="password" id="lPass" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;">Sign In</button>
      <p class="admin-error" id="loginError" style="display:none;"></p>
    </form>
  </div>
</div>

<!-- ============ DASHBOARD VIEW ============ -->
<div id="dashView" style="display:none;">
  <nav class="admin-nav">
    <div class="wrap">
      <a href="index.html" class="brand">
        <img src="assets/img/logo.png" alt="JAMA crest">
        <span>JAMA Review Console</span>
      </a>
      <div class="status">
        <span id="whoami"></span>
        <button class="btn btn-ghost btn-sm" id="signOutBtn" type="button">Sign Out</button>
      </div>
    </div>
  </nav>

  <main class="admin-main">
    <div class="wrap">
      <div class="admin-head">
        <h2>Review Moderation</h2>
        <span class="count-pill" id="pendingCount">0 pending</span>
      </div>

      <div class="admin-tabs">
        <button class="active" data-tab="pending">Pending</button>
        <button data-tab="approved">Approved</button>
        <button data-tab="rejected">Rejected</button>
      </div>

      <div id="modList"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/admin.js" defer></script>
</body>
</html>
